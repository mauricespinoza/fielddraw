<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FieldDraw · Google sign-in</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1117;
        color: #e6edf3;
        font: 16px/1.5 system-ui, -apple-system, sans-serif;
        padding: 16px;
        box-sizing: border-box;
        text-align: center;
      }
      a { color: #58a6ff; }
    </style>
  </head>
  <body>
    <p id="msg">Connecting to Google Drive…</p>
    <script>
      /*
       * Retorno del inicio de sesión con Google (ver src/drive/auth.js).
       *
       * Deja la respuesta en localStorage —mismo origen que la app— y avisa por
       * BroadcastChannel. No usa window.opener: Google lo corta (COOP). El
       * modo va al final del `state`: «.p» ventana emergente (se cierra),
       * «.r» redirección (vuelve a la app, que recoge el token al arrancar).
       */
      (function () {
        var hash = location.hash.replace(/^#/, '');
        var state = new URLSearchParams(hash).get('state') || '';
        var payload = JSON.stringify({ hash: hash, at: Date.now() });
        try {
          localStorage.setItem('fielddraw.drive.oauth-return.v1', payload);
        } catch (e) {}
        try {
          var ch = new BroadcastChannel('fielddraw-oauth');
          ch.postMessage(payload);
          ch.close();
        } catch (e) {}
        // El token no se queda en el historial del navegador.
        try {
          history.replaceState(null, '', location.pathname);
        } catch (e) {}
        if (/\.p$/.test(state)) {
          window.close();
          setTimeout(function () {
            document.getElementById('msg').innerHTML =
              'Done. You can close this window and go back to FieldDraw.';
          }, 400);
        } else {
          location.replace('./');
        }
      })();
    </script>
  </body>
</html>
