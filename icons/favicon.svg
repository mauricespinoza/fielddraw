<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    EL ICONO DE LA PESTAÑA ES EL MISMO QUE SE VE DENTRO DE LA APP.

    Este archivo es, trazo por trazo, el `<svg class="brand-logo">` de la
    franja superior de index.html, sobre su misma rejilla de 24×24. Antes no
    coincidían: la pestaña y el icono del sistema traían un contacto turquesa
    con una falla inversa, y arriba a la izquierda de la app se veía otra cosa
    —una tablet con un lápiz—, así que quien la instalaba tenía un icono en el
    lanzador y otro al abrirla.

    Va en vector y no como el PNG incrustado que había antes: a 16 px, que es
    donde de verdad se mira un favicon, el navegador lo rasteriza a ese tamaño
    en vez de reducir una imagen de 192.

    Los tres archivos salen del mismo dibujo: aquí a mano, y en
    icons/icon-180/192/512.png a través de `node tools/make-icons.mjs`, que
    lleva las mismas coordenadas. Si se cambia uno hay que cambiar los tres.
  -->
  <rect width="24" height="24" rx="5.5" fill="#0b0f14" />
  <rect x="0.6" y="0.6" width="22.8" height="22.8" rx="5" fill="none" stroke="#e6edf3" stroke-opacity="0.16" stroke-width="1.2" />
  <!-- la tablet -->
  <rect x="3.6" y="8.8" width="12.6" height="10.2" rx="1.6" fill="none" stroke="#2dd4bf" stroke-width="1.4" />
  <!-- el contacto que se está dibujando en su pantalla -->
  <path d="M5.6 15.9 8.6 12.7 10.9 15 13.3 11.6" fill="none" stroke="#ffb300" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- el lápiz, con la mina tocando el extremo del trazo -->
  <line x1="20.2" y1="2.6" x2="15.1" y2="10" stroke="#f87171" stroke-width="2.3" stroke-linecap="round" />
  <path d="M15.1 10 13.1 11.9 14.3 9.3z" fill="#e6edf3" />
</svg>
