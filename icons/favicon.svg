<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    El favicon tiene que ser el MISMO dibujo que icons/icon-192.png (y su
    182/512): antes traía un boceto aparte —un lápiz sobre una tablet—, así
    que la pestaña del navegador, la vista previa de la URL y el icono que
    queda al añadir la app a la pantalla de inicio no coincidían. Se incrusta
    aquí el PNG tal cual en vez de redibujarlo a mano para que sean, bit a
    bit, el mismo icono.
  -->
  <image href="data:image/png;base64," width="192" height="192" />
</svg>
