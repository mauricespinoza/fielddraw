<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    El mismo dibujo que la franja de la marca en index.html: un lápiz trazando
    una línea sobre una tablet. A 16 px la tablet se lee como un rectángulo y
    el lápiz como una diagonal, que es todo lo que una pestaña necesita para
    distinguirse; por eso el trazo va más grueso que en la franja, donde hay
    34 px para lucirlo.
  -->
  <rect width="24" height="24" rx="5.5" fill="#0b0f14" />
  <!-- la tablet -->
  <rect x="3.2" y="8.4" width="13.4" height="10.9" rx="1.7" fill="none" stroke="#2dd4bf" stroke-width="1.8" />
  <!-- el contacto que se está dibujando en su pantalla -->
  <path d="M5.5 16.2 8.7 12.7 11.1 15.1 13.7 11.4" fill="none" stroke="#ffb300" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- el lápiz, con la mina tocando el extremo del trazo -->
  <line x1="20.4" y1="2.4" x2="15.2" y2="9.9" stroke="#f87171" stroke-width="3" stroke-linecap="round" />
  <path d="M15.2 9.9 12.9 12.1 14.3 9.1z" fill="#e6edf3" />
</svg>
